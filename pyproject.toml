[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cricketmind"
version = "1.0.0"
description = "T20 cricket analyst: backtested models, search over ball-by-ball data, and a tool-using assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Vikaas Surampudi", email = "surampudi4u@gmail.com"},
]

# Core: download the data, build the database, features and player ratings, counting stats.
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26",
    "pyarrow>=16.0.0",   # pandas reads / writes the Parquet files through it
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5.0",  # also TF-IDF for match search
    "xgboost>=2.0.0",       # on Linux this needs the libgomp system library
    "shap>=0.45.0",
]
rag = [
    "fastembed>=0.3.0",  # dense embeddings (ONNX, no PyTorch)
    "chromadb>=1.0.0",   # persistent vector store for the entity index
]
agent = [
    "anthropic>=1.0.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]
# Everything needed to run the web app.
serve = ["cricketmind[ml,rag,agent,api]"]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

# An application, not a library: it finds frontend/ and data/ relative to the checkout, so run it
# from a source tree (pip install -e .).
[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# naming style only: module aliases like "import entity_index as EI" and SQL-ish constants
ignore = ["N812", "N814", "N806", "N818"]

[tool.ruff.lint.per-file-ignores]
# tests re-import pytest fixtures (F811/F401) and carry long expected strings
"tests/*" = ["E501", "F811", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
