[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cricketmind"
version = "0.1.0"
description = "Cricket analytics LLM — hybrid ML + fine-tuned model + RAG for T20 predictions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Vikaas Surampudi", email = "surampudi4u@gmail.com"},
]

dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "requests>=2.32.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.4.0",
    "shap>=0.45.0",
    "mlflow>=2.14.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]
llm = [
    "transformers>=4.42.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.31.0",
    "datasets>=2.20.0",
    "sentence-transformers>=3.0.0",
]
rag = [
    "chromadb>=0.5.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.36.0",
]
agent = [
    "anthropic>=1.0.0",
]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
all = ["cricketmind[ml,llm,rag,api,agent,dev]"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
