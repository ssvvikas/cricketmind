name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4   # the page's JavaScript is tested under Node
        with:
          node-version: 22
      - name: Install
        run: pip install -e ".[serve,dev]"
      - name: Lint
        run: ruff check src tests eval
      - name: Tests (hermetic, so no data or API key is needed)
        run: pytest -q
